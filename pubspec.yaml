name: loyalty_app
description: "Multi-category digital loyalty platform — one app for customers, business owners and staff."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.10.0
  logging: ^1.3.0
  get_it: ^8.3.0
  shared_preferences: ^2.5.5
  dartz: ^0.10.1
  intl: ^0.20.2
  equatable: ^2.1.0
  flutter_screenutil: ^5.9.3
  flutter_spinkit: ^5.2.1
  provider: ^6.1.2
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  url_launcher: ^6.3.3
  # Explore map. OpenStreetMap tiles need no API key, so the app runs before
  # the Google Maps / Mapbox account exists; only ExploreMapView touches it.
  geolocator: ^14.0.2
  # Staff scanning (S1/S2) and the customer's rotating QR (C10/C11).
  mobile_scanner: ^7.1.2
  qr_flutter: ^4.1.0
  flutter_stripe: ^14.2.0
  socket_io_client: ^3.1.6
  google_maps_flutter: ^2.18.1
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.16
  flutter_lints: ^5.0.0

# Localization config
flutter_intl:
  main_locale: en
  enabled: true
  output_dir: lib/core/translations
  arb_dir: lib/core/translations/l10n

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg_images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800

    # Display face for titles and numbers (variable font; weight is set with
    # FontVariation in AppTextStyle).
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-Variable.ttf
